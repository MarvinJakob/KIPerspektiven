name: Release-Nacharbeit
on:
  workflow_run:
    workflows: [Release Gate]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: release-followup
  cancel-in-progress: false
jobs:
  followup:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      # Only trusted default-branch tools, never code/artifacts from the triggering run.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Getesteten Commit laden
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: release-metadata
          path: .build/release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: node tools/release-followup.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_METADATA: .build/release-metadata/release-metadata.json
