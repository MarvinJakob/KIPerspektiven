# Ganze Fidelity-Suite auf main, nur auf Anforderung: `gh workflow run fidelity-run.yml`.
# Nach jedem Push auf main läuft dieselbe Suite bereits im Release Gate (Artefakt fidelity-release) und vor
# jedem Merge im Merge Gate. Team 2 führt nur die Tests seines Tickets lokal aus (AGENTS_TESTER.md).
# Dieser Lauf dient dem Reviewer zur Diagnose, z. B. ob eine Regression stabil auftritt, ohne ein Release
# auszulösen (AGENTS_REVIEWER.md). Das Artefakt fidelity-main enthält results.json, Inventar und Bericht.
name: Fidelity-Lauf

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fidelity-main
  cancel-in-progress: true

jobs:
  fidelity:
    name: Fidelity-Suite auf main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app
          tags: ki-web:ci
          load: true
          cache-from: type=gha
      - uses: ./.github/actions/fidelity
        with:
          image: ki-web:ci
          report-name: fidelity-main
