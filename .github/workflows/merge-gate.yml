name: Merge Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Produktion und Rollback teilen dieselbe Sperre. Installationen nie abbrechen.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'release-production' || format('merge-gate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Der bestehende Pflichtcheck heißt weiterhin „Merge Gate“.
    name: Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      image-id: ${{ steps.identity.outputs.image-id }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: app
          tags: ki-web:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image laden und Version bestimmen
        id: identity
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          commit=$(git rev-parse HEAD)
          image=$(docker image inspect -f '{{.Id}}' ki-web:ci)
          digest=${image#sha256:}
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=${commit:0:12}-${digest:0:12}" >> "$GITHUB_OUTPUT"
          echo "image-id=$image" >> "$GITHUB_OUTPUT"
      - name: Geprüftes Image für die Installation speichern
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Neue Version installieren
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: prd
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
      - name: Überholte Installation verhindern
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          git fetch origin main
          test "$COMMIT" = "$(git rev-parse origin/main)"
      - uses: actions/download-artifact@v5
        with:
          name: production-image
          path: ${{ runner.temp }}
      - uses: ./.github/actions/ssh-setup
        with:
          ssh-key: ${{ secrets.HETZNER_SSH }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Bisherige Version merken
        id: previous
        run: |
          previous=$(bash app/deploy/deploy.sh version)
          [[ -z "$previous" || "$previous" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          echo "version=$previous" >> "$GITHUB_OUTPUT"
      - name: Geprüftes Image installieren und Healthcheck ausführen
        id: install
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE_ID: ${{ needs.build.outputs.image-id }}
        run: bash app/deploy/deploy.sh deploy "$COMMIT" "$RUNNER_TEMP/image.tar" "$IMAGE_ID" "$VERSION"
      - name: Bei Installationsfehler bisherige Version wiederherstellen
        if: failure() && steps.install.outcome == 'failure' && steps.previous.outputs.version != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: bash app/deploy/deploy.sh switch "$PREVIOUS"
      - name: Alte Versionen aufräumen
        run: bash app/deploy/deploy.sh prune
      - name: SSH-Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy
      - name: Installierte Version dokumentieren
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "Installierte Version: $VERSION (Commit $COMMIT)" >> "$GITHUB_STEP_SUMMARY"
