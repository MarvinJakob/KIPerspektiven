# Merge Gate: Jeder Pull Request nach main muss alle Prüfungen bestehen (AGENTS.md, „Merge Gate“).
# Als Pflichtprüfung in der Branch-Regel für main reicht der Abschlussjob „Merge Gate“.
# Die Agenten wiederholen diese Prüfungen nicht lokal (AGENTS.md, „Arbeitsteilung mit GitHub Actions“).
#
#   scope     Team-Grenzen und Auswahl der Fidelity-Tests des Features
#   build     Docker-Image wie in Produktion (beide Frontends und Backend)
#   tests     Unit- und Komponententests (Backend mit Race-Detector, beide Frontends)
#   security  govulncheck, npm audit, Dependency Review, Secret-Scan
#   review    Prozesswerkzeuge; Nachweis des unabhängigen Reviews (entfällt für Baseline-PRs verify/<n>)
#   fidelity  nur die Features des PRs; Vollsuite und globale Baseline ausschließlich im Release Gate
name: Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Team-Grenzen
    runs-on: ubuntu-latest
    outputs:
      required-ids: ${{ steps.ids.outputs.required }}
      selected-ids: ${{ steps.ids.outputs.selected }}
      grep: ${{ steps.ids.outputs.grep }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Geänderte Dateien gegen Team-Regeln prüfen
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/check-scope.mjs

      - name: Geforderte Fidelity-IDs bestimmen
        id: ids
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/feature-tests.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: app
          tags: ki-web:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  tests:
    name: Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/unit-tests

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"  # neuester Patch wie golang:1.27-alpine im Dockerfile
          check-latest: true
          cache-dependency-path: app/backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Bekannte Schwachstellen in Go-Abhängigkeiten (govulncheck)
        working-directory: app/backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Bekannte Schwachstellen in npm-Abhängigkeiten
        run: |
          for dir in app/frontend app/frontend-redaktion fidelity; do
            echo "== $dir"; (cd "$dir" && npm audit --audit-level=high)
          done
      - name: Neue Abhängigkeiten prüfen
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Secret-Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prozesswerkzeuge prüfen
        run: |
          node --test tools/*.test.mjs fidelity/scripts/*.test.mjs
          bash tools/task.test.sh
          bash tools/deploy.test.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - name: Checkliste im PR-Text
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$DRAFT" != "true" ]] || { echo "::error::Entwurf: erst nach „Ready for review“ mergebar."; exit 1; }
          # Prüft Checkliste, Sitzungs-IDs und den GitHub-Review-Nachweis des aktuellen Commits.
          # Baseline-PRs (verify/<n>) brauchen keinen: Team-Grenzen und Fidelity weisen sie nach.
          node tools/check-review.mjs

  fidelity:
    name: Fidelity
    needs: [scope, build]
    if: needs.scope.outputs.grep != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/image.tar"
      - uses: ./.github/actions/fidelity
        with:
          image: ki-web:ci
          grep: ${{ needs.scope.outputs.grep }}
          selected-ids: ${{ needs.scope.outputs.selected-ids }}
          required-ids: ${{ needs.scope.outputs.required-ids }}
          allow-backlog: 'true'

  merge-gate:
    name: Merge Gate
    if: always()
    needs: [scope, build, tests, security, review, fidelity]
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis
        env:
          RESULTS: ${{ toJSON(needs) }}
          FEATURE_GREP: ${{ needs.scope.outputs.grep }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e --arg grep "$FEATURE_GREP" \
            'to_entries | all(.[]; .value.result == "success" or (.key == "fidelity" and .value.result == "skipped" and $grep == ""))' > /dev/null \
            || { echo "::error::Merge Gate nicht bestanden."; exit 1; }
          echo "Merge Gate bestanden."
