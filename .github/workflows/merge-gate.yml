# Pflichtcheck für Pull Requests nach main (AGENTS.md, Abschnitt 5; Anforderung #55).
# Führt nur die vom PR betroffenen Tests aus. Installiert nichts; das übernimmt das Release Gate nach dem Merge.
name: Merge Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Testauswahl
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.plan.outputs.any }}
      process: ${{ steps.plan.outputs.process }}
      backend: ${{ steps.plan.outputs.backend }}
      frontends: ${{ steps.plan.outputs.frontends }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Betroffene Tests bestimmen
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/affected-tests.mjs plan --base "$BASE" --head HEAD

  tests:
    name: Tests
    needs: plan
    if: needs.plan.outputs.any == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      process: ${{ needs.plan.outputs.process == 'true' }}
      backend: ${{ needs.plan.outputs.backend }}
      frontends: ${{ needs.plan.outputs.frontends }}
      e2e: ${{ needs.plan.outputs.e2e }}

  gate:
    # Name des Pflichtchecks im Branch-Schutz; kein anderer Job darf so heißen.
    name: Merge Gate
    needs: [plan, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testauswahl und Testergebnisse auswerten
        env:
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.tests.result }}
          ANY: ${{ needs.plan.outputs.any }}
        run: |
          echo "Testauswahl: $PLAN · Tests: $TESTS"
          if [ "$PLAN" != success ]; then
            echo '::error::Testauswahl fehlgeschlagen oder Zuordnung ungeklärt (siehe Job Testauswahl).'
            exit 1
          fi
          if [ "$ANY" = true ]; then
            [ "$TESTS" = success ] || { echo "::error::Ausgewählte Tests nicht erfolgreich: $TESTS"; exit 1; }
          else
            echo 'Nachvollziehbar testfreie Änderung: keine Tests ausgewählt (Begründung im Job Testauswahl).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v5
      - name: Geprüften Dateiinhalt dokumentieren
        id: tree
        run: |
          git show -s --format='%H %T' HEAD > "$RUNNER_TEMP/gepruefter-stand.txt"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      # Nachweis für Release-Blocker (tools/release-blockers.mjs): gilt für denselben Git-Tree.
      - name: Nachweis zum geprüften Stand sichern
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.tree.outputs.tree }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gepruefter-stand.txt
          if-no-files-found: error
      - name: Nachweislink für Bug-Tickets ausgeben
        env:
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          echo "Release-Nachweis: $EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
