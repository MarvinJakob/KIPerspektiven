# Release Gate: bringt den aktuellen Stand von main („Code Stream“) als Release auf den Hetzner-Server.
#
#   1. Build        Image aus den gestapelten Commits von main neu bauen
#   2. Test         ganze Unit-Test-Suite und ganze Fidelity-Suite (keine Regression gegen die Baseline)
#   3. Final Check  keine offenen release-blocker, Fast-Forward auf release möglich, Stand noch nicht released
#   4. release      Branch release auf den geprüften Commit vorziehen
#   5. Package      Hetzner-Snapshot, Image auf dem Server bauen und starten, Smoke-Test gegen Produktion
#   6. Publish      erst ganz am Ende: Tag und GitHub-Release im Repository
#
# Start: Actions → Release Gate → Run workflow (oder `gh workflow run release.yml`).
# Secrets und Variablen: ARCHITECTURE.md, Abschnitt „Secrets und Variablen“.
name: Release Gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit oder Branch, der released wird
        default: main
      snapshot:
        description: Vor dem Deployment einen Hetzner-Snapshot anlegen
        type: boolean
        default: true

permissions:
  contents: read

# Releases laufen nacheinander und werden nicht abgebrochen
concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  build:
    name: 1 Build
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.stand.outputs.commit }}
      version: ${{ steps.stand.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: stand
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app
          tags: ki-web:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  unit-tests:
    name: 2 Test (Unit)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: ./.github/actions/unit-tests

  fidelity:
    name: 2 Test (Fidelity)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/download-artifact@v5
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/image.tar"
      - uses: ./.github/actions/fidelity
        with:
          image: ki-web:ci
          report-name: fidelity-release

  final-check:
    name: 3 Final Check
    needs: [build, unit-tests, fidelity]
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          blockers=$(gh issue list --state open --label release-blocker --json number,title --jq '.[] | "#\(.number) \(.title)"')
          if [[ -n "$blockers" ]]; then
            echo "::error::Offene release-blocker:"; echo "$blockers"; exit 1
          fi
          if git rev-parse --verify -q origin/release > /dev/null; then
            if [[ "$(git rev-parse origin/release)" == "$COMMIT" ]]; then
              echo "Dieser Stand ist bereits released, es gibt nichts zu tun."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git merge-base --is-ancestor origin/release "$COMMIT" \
              || { echo "::error::release ist nicht Vorfahre von $COMMIT, kein Fast-Forward möglich."; exit 1; }
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  release-branch:
    name: 4 Release-Branch
    needs: [build, final-check]
    if: needs.final-check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
      - name: release vorziehen (nur Fast-Forward)
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
        run: git push origin "$COMMIT:refs/heads/release"

  package:
    name: 5 Package und Deployment
    needs: [build, release-branch]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}

      - name: Snapshot des Servers
        if: inputs.snapshot
        uses: ./.github/actions/hcloud-snapshot
        with:
          token: ${{ secrets.HCLOUD_TOKEN }}
          server-name: ${{ vars.HCLOUD_SERVER_NAME }}
          description: vor Release ${{ needs.build.outputs.version }}

      - uses: ./.github/actions/ssh-setup
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Image auf dem Server bauen und starten
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          COMMIT: ${{ needs.build.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
        # Bei ungesunder neuer Version startet deploy.sh die bisherige Version und endet mit Fehler
        run: app/deploy/deploy.sh release "$COMMIT" "$VERSION"

      - name: SSH-Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy

      - name: Smoke-Test gegen Produktion (REQ-0)
        if: vars.DEPLOY_URL != ''
        uses: ./.github/actions/fidelity
        with:
          base-url: ${{ vars.DEPLOY_URL }}
          grep: '^REQ-0-'
          required-ids: REQ-0-AC1 REQ-0-AC2 REQ-0-AC3
          report-name: fidelity-production

  publish:
    name: 6 Publish
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
      - name: Tag und GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.build.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          tag="v$(TZ=Europe/Berlin date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --target "$COMMIT" --title "$tag" --generate-notes \
            --notes "Bereitgestellt auf ${DEPLOY_URL:-Hetzner} als Image-Version \`ki-web:$VERSION\` (Commit \`$COMMIT\`)."
          {
            echo "### Release $tag"
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Image | \`ki-web:$VERSION\` |"
            echo "| Adresse | ${DEPLOY_URL:-–} |"
          } >> "$GITHUB_STEP_SUMMARY"
