name: Bug (fehlgeschlagener Fidelity-Test)
description: Von Team 2 angelegt, wenn ein Fidelity-Test seines Tickets nicht besteht. Team 3 behebt genau dieses Ticket.
title: "[REQ-<n>-AC<m>] <Was funktioniert nicht>"
labels: [bug]
body:
  - type: input
    id: ids
    attributes:
      label: Test-IDs
      description: Alle fehlschlagenden IDs dieser Fehlerursache, Leerzeichen-getrennt. Team 3 übernimmt sie in die Zeile „Fidelity:“ seines PR.
      placeholder: REQ-12-AC2 REQ-12-AC3
    validations:
      required: true
  - type: input
    id: anforderung
    attributes:
      label: Anforderung
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: ergebnis
    attributes:
      label: Erwartet und tatsächlich
      description: Erwartetes Verhalten laut Spezifikation (Kriterium zitieren), tatsächliches Verhalten laut Testlauf (Fehlermeldung kürzen). Angeben, wenn nur Desktop oder nur Mobil betroffen ist.
    validations:
      required: true
  - type: textarea
    id: reproduktion
    attributes:
      label: Nachstellen ohne Test
      description: Team 3 führt keine Fidelity-Tests aus. Schritte, mit denen sich das Verhalten im Browser oder per HTTP beobachten lässt (URL, Testkonto aus DEV_SEED, Aktion, sichtbares Ergebnis).
      placeholder: |
        1. /de/kontakt öffnen
        2. Formular ohne E-Mail absenden
        3. Erwartet: Hinweis „Bitte E-Mail angeben“ – tatsächlich: keine Meldung
    validations:
      required: true
  - type: input
    id: lauf
    attributes:
      label: Getesteter Stand
      description: Commit von main, gegen den Team 2 getestet hat (bei Release-Nacharbeit zusätzlich der Link zum Lauf)
    validations:
      required: true
