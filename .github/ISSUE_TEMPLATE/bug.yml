name: Bug
description: Nachgewiesene Abweichung mit Kriterien, Reproduktion und geprüftem Stand erfassen.
title: "[REQ-<n>-AC<m>] <Was funktioniert nicht>"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Das Ursprungsticket verlinken. Der verantwortliche Agent behebt den Bug nach Möglichkeit im laufenden PR und schließt ihn nach erfolgreichem Produktionsnachweis ab.
  - type: input
    id: ids
    attributes:
      label: Kriterien-IDs
      description: Alle betroffenen Akzeptanzkriterien dieser Fehlerursache, Leerzeichen-getrennt.
      placeholder: REQ-12-AC2 REQ-12-AC3
    validations:
      required: true
  - type: input
    id: anforderung
    attributes:
      label: Anforderung
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: ergebnis
    attributes:
      label: Erwartet und tatsächlich
      description: Erwartetes Verhalten laut Spezifikation (Kriterium zitieren), tatsächliches Verhalten (Fehlermeldung kürzen). Angeben, wenn nur Desktop oder nur Mobil betroffen ist.
    validations:
      required: true
  - type: textarea
    id: reproduktion
    attributes:
      label: Nachstellen
      description: Schritte für Browser oder HTTP (URL, Testkonto aus DEV_SEED, Aktion, sichtbares Ergebnis).
      placeholder: |
        1. /de/kontakt öffnen
        2. Formular ohne E-Mail absenden
        3. Erwartet: Hinweis „Bitte E-Mail angeben“ – tatsächlich: keine Meldung
    validations:
      required: true
  - type: input
    id: lauf
    attributes:
      label: Geprüfter Stand
      description: Geprüfter Commit und gegebenenfalls Link zum CI-Lauf
    validations:
      required: true
