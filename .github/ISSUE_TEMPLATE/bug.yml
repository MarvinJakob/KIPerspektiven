name: Bug
description: Team 2 oder Team 4 dokumentiert fehlerhaftes Verhalten für Team 3.
title: "[REQ-<n>-AC<m>] <Was funktioniert nicht>"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Neuer Bug eines bereits implementierten Tickets: im Issue-Text eine eigene Zeile `Feature-Ticket: #<Ursprungsticket>` ergänzen (oder `node tools/feature-bug.mjs` verwenden). Das Ursprungsticket bleibt bis zum letzten abgeschlossenen Fix im Merge Gate. Die Anforderung unten bezeichnet weiterhin die REQ-Nummer.
  - type: input
    id: ids
    attributes:
      label: Kriterien-IDs
      description: Alle betroffenen Akzeptanzkriterien dieser Fehlerursache, Leerzeichen-getrennt.
      placeholder: REQ-12-AC2 REQ-12-AC3
    validations:
      required: true
  - type: input
    id: anforderung
    attributes:
      label: Anforderung
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: ergebnis
    attributes:
      label: Erwartet und tatsächlich
      description: Erwartetes Verhalten laut Spezifikation (Kriterium zitieren), tatsächliches Verhalten (Fehlermeldung kürzen). Angeben, wenn nur Desktop oder nur Mobil betroffen ist.
    validations:
      required: true
  - type: textarea
    id: reproduktion
    attributes:
      label: Nachstellen
      description: Schritte für Browser oder HTTP (URL, Testkonto aus DEV_SEED, Aktion, sichtbares Ergebnis).
      placeholder: |
        1. /de/kontakt öffnen
        2. Formular ohne E-Mail absenden
        3. Erwartet: Hinweis „Bitte E-Mail angeben“ – tatsächlich: keine Meldung
    validations:
      required: true
  - type: input
    id: lauf
    attributes:
      label: Geprüfter Stand
      description: Geprüfter Commit und gegebenenfalls Link zum CI-Lauf
    validations:
      required: true
