name: Feature (bestandene Fidelity-Tests)
description: Von Team 2 angelegt und sofort geschlossen, wenn Akzeptanzkriterien einer Anforderung nachweislich funktionieren.
title: "[REQ-<n>] funktioniert: <Kurzbeschreibung>"
labels: [feature]
body:
  - type: input
    id: ids
    attributes:
      label: Bestandene Test-IDs
      description: Alle IDs, die Team 2 in diesem Testlauf neu in die Baseline aufgenommen hat
      placeholder: REQ-12-AC1 REQ-12-AC2
    validations:
      required: true
  - type: input
    id: anforderung
    attributes:
      label: Anforderung
      placeholder: "#12"
    validations:
      required: true
  - type: input
    id: nachweis
    attributes:
      label: Nachweis
      description: Getesteter Commit von main und Baseline-PR (dessen Merge Gate die IDs bestätigt hat)
      placeholder: "Commit 7076cf6, PR #52"
    validations:
      required: true
