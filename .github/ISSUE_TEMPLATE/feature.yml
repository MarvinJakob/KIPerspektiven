name: Feature (Implementierung)
description: Team 2 oder Team 4 dokumentiert eine spezifizierte, noch fehlende Funktion für Team 3.
title: "[REQ-<n>-AC<m>] <Welche Funktion fehlt>"
labels: [feature]
body:
  - type: input
    id: ids
    attributes:
      label: Kriterien-IDs
      description: Alle Kriterien dieses Implementierungsauftrags
      placeholder: REQ-12-AC1 REQ-12-AC2
    validations:
      required: true
  - type: input
    id: anforderung
    attributes:
      label: Anforderung
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: verhalten
    attributes:
      label: Erwartete Funktion und aktuelles Verhalten
      description: Verhalten laut Spezifikation und nachgewiesener fehlender Umfang
    validations:
      required: true
  - type: textarea
    id: reproduktion
    attributes:
      label: Reproduktion und Nachweis
      description: Schritte, geprüfter Commit, Befehl und Lauf/Fehlermeldung
    validations:
      required: true
