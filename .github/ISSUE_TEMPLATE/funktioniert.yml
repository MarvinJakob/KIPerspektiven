name: Funktioniert (Funktionsnachweis)
description: Dokumentiert erfüllte Kriterien nach erfolgreicher Produktionsauslieferung.
title: "[REQ-<n>] funktioniert: <Kurzbeschreibung>"
labels: [works]
body:
  - type: input
    id: ids
    attributes:
      label: Erfüllte Kriterien-IDs
      placeholder: REQ-12-AC1 REQ-12-AC2
    validations:
      required: true
  - type: input
    id: anforderung
    attributes:
      label: Anforderung
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: nachweis
    attributes:
      label: Nachweis
      description: Geprüfter Commit, Desktop-/Mobil-Ergebnis und Produktionsnachweis
    validations:
      required: true
