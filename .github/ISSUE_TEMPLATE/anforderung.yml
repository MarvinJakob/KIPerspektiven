name: Anforderung
description: Neue Anforderung mit Ziel, Mehrwert und verbindlichen Akzeptanzkriterien für den Backlog.
title: "<Kurzer Titel der Anforderung>"
labels: [requirement, needs-analysis]
body:
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: Als <Rolle> möchte ich <Ziel>, damit <Mehrwert>.
    validations:
      required: true
  - type: textarea
    id: beschreibung
    attributes:
      label: Fachliche Beschreibung
      description: Kurz und verständlich, was die Funktion leistet.
    validations:
      required: true
  - type: textarea
    id: kriterien
    attributes:
      label: Akzeptanzkriterien
      description: Nummerierte, beobachtbare Bedingungen (Gegeben/Wenn/Dann), einschließlich relevanter Fehler- und Grenzfälle. Daraus entstehen vor der Umsetzung Fidelity-Tests.
    validations:
      required: true
  - type: textarea
    id: technik
    attributes:
      label: Technische Details (optional)
