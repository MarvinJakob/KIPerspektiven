# Unit- und Komponententests des ganzen Codes: Backend (go vet, go test, Race-Detector) und beide Frontends.
# Genutzt vom Merge Gate (.github/workflows/merge-gate.yml) und vom Release Gate (.github/workflows/release.yml).
name: Unit-Tests
description: go vet, go test sowie Typprüfung und Tests beider Frontends

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: app/backend/go.mod
        cache-dependency-path: app/backend/go.sum

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          app/frontend/package-lock.json
          app/frontend-redaktion/package-lock.json

    - name: Backend
      shell: bash
      working-directory: app/backend
      run: go vet ./... && go test ./...

    # Ticket #138: Parallelitätstests der Anmeldung zusätzlich mit dem Race-Detector. Er braucht CGO und einen
    # C-Compiler; beides ist auf den Linux-Runnern vorhanden, lokal unter Windows oft nicht.
    - name: Backend-Parallelitätstests mit Race-Detector
      shell: bash
      working-directory: app/backend
      env:
        CGO_ENABLED: "1"
      run: go test -race -count=1 -run 'Limiter|Throttle|TestParallelLogins|TestPasswordChecks|TestLoginOutcomes|TestLoginRateLimit' ./internal/auth ./internal/http

    - name: Öffentliches Frontend
      shell: bash
      working-directory: app/frontend
      run: npm ci && npm run typecheck && npm test

    - name: Redaktionsfrontend
      shell: bash
      working-directory: app/frontend-redaktion
      run: npm ci && npm run typecheck && npm test
