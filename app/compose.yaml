# Produktion auf dem Hetzner-Cloud-Server (ARCHITECTURE.md, Abschnitt 9).
# Deployment und Rollback mit deploy/deploy.sh, siehe docs/betrieb.md.
# Entwicklungs-Testdaten (DEV_SEED) sind hier bewusst nicht gesetzt.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    # Feste Version: Zeitbasierte Rotation des Zugriffsprotokolls (roll_interval) gibt es erst ab 2.11 (#80).
    image: caddy:2.11.9-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      # Weitere Adressen, die auf DOMAIN umleiten, z. B. "www.marvinjakob.de 78-47-14-178.sslip.io"
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - app_media:/srv/media:ro
    networks:
      proxy:
        ipv4_address: 172.30.142.2
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  backend:
    image: ${REGISTRY}/ki-web:${VERSION}
    environment:
      DATABASE_PATH: /data/db/app.db
      MEDIA_PATH: /data/media
      PUBLIC_BASE_URL: https://${DOMAIN}
      # Nur die feste Caddy-IP darf Client-IP-Header für Statistik und Ratenbegrenzung liefern.
      TRUSTED_PROXIES: "172.30.142.2/32"
      # Die Webseite ist öffentlich (Ticket #108); die Redaktion prüft Sitzung und Rolle unabhängig davon.
      # REQUIRE_LOGIN=true in der .env schaltet den optionalen Zugangsschutz aus Ticket #49 wieder ein.
      REQUIRE_LOGIN: ${REQUIRE_LOGIN:-false}
    # Feste Adresse: Startet das Backend vor Caddy, würde Docker ihm sonst die erste freie Adresse
    # 172.30.142.2 zuweisen und Caddy scheitert mit „Address already in use“ (Ticket #17).
    networks:
      proxy:
        ipv4_address: 172.30.142.3
    volumes:
      - app_db:/data/db
      - app_media:/data/media
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Nach dem Start alle 2 s prüfen, damit Deployments nicht 30 s auf den ersten Healthcheck warten
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    logging: *logging

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.142.0/24

volumes:
  caddy_data:
  app_db:
  app_media:
