openapi: 3.0.3
info:
  title: KI Perspektiven API
  version: 0.1.0
  description: |
    Verbindlicher Vertrag zwischen Frontend und Backend (siehe requirements/ARCHITECTURE.md, Abschnitt 5).
    Öffentliche Endpunkte liefern ausschließlich veröffentlichte Beiträge und fachlich freigegebene
    Audit-Dimensionen.

    Redaktion (ab Sprint 3): Die Anmeldung setzt ein HttpOnly-Sitzungscookie (`ki_session`). Alle Pfade
    unter `/api/admin` verlangen eine gültige Sitzung (sonst `401`) und die passende Rolle (sonst `403`).
    Schreibende Aufrufe mit Sitzung senden zusätzlich das CSRF-Token aus `GET /api/auth/me` im Header
    `X-CSRF-Token` (sonst `403`). Einen Endpunkt zur Selbstregistrierung gibt es nicht.

    Sprachauswahl: Jede Ressource wird in der angefragten Sprache geliefert. Fehlt die Übersetzung,
    liefert das Backend die vorhandene Fassung (zuerst Deutsch). Das Feld `lang` nennt immer die
    tatsächlich gelieferte Sprache.
servers:
  - url: /
paths:
  /api/admin/articles:
    get:
      operationId: adminListArticles
      summary: Themenartikel der Redaktion
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Themenartikel der Redaktion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: adminCreateArticle
      summary: Themenartikel anlegen
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '201':
          description: Themenartikel anlegen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/articles/{id}:
    get:
      operationId: adminGetArticle
      summary: Themenartikel bearbeiten
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Themenartikel bearbeiten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: adminUpdateArticle
      summary: Inhalt und Veröffentlichungsstatus speichern
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Inhalt und Veröffentlichungsstatus speichern
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: adminDeleteArticle
      summary: Themenartikel löschen
      parameters:
        - $ref: '#/components/parameters/Id'
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Themenartikel löschen
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/articles/media:
    put:
      operationId: adminUploadArticleImage
      summary: Artikelbild hochladen
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Artikelbild hochladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/articles:
    get:
      operationId: listArticles
      summary: Veröffentlichte Themenartikel
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Veröffentlichte Themenartikel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/articles/{id}:
    get:
      operationId: getArticle
      summary: Veröffentlichten Themenartikel lesen
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Veröffentlichten Themenartikel lesen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/topics:
    get:
      operationId: listTopics
      summary: Alle Themen mit Titel und Einführung
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Themen in fester Reihenfolge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/topics/{slug}:
    get:
      operationId: getTopic
      summary: Ein Thema mit seinen veröffentlichten Beiträgen
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Thema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/posts:
    get:
      operationId: listPosts
      summary: Veröffentlichte Beiträge, neueste zuerst
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: featured
          in: query
          required: false
          description: |
            `true` liefert die Beiträge für das Karussell der Startseite (höchstens drei).
            An erster Stelle steht immer der zuletzt veröffentlichte Beitrag, danach folgen
            die neuesten weiteren hervorgehobenen Beiträge.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Beiträge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/posts/{slug}:
    get:
      operationId: getPost
      summary: Ein veröffentlichter Beitrag
      description: Für Entwürfe und unbekannte Beiträge antwortet das Backend mit `404`.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Beitrag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/audit:
    get:
      operationId: getAudit
      summary: Einstieg in das KI-Audit mit allen freigegebenen Dimensionen
      description: Erscheint auf der Themenseite `ai-audit` (Anforderung 8).
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Einführung, Reifegrade und Dimensionen in fester Reihenfolge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/audit/dimensions/{slug}:
    get:
      operationId: getAuditDimension
      summary: Eine Audit-Dimension mit Vorteilen, Reifegraden und Prüffragen
      description: |
        Inhalte eines Schritts der Selbsteinschätzung (Anforderung 9, Ticket #113). Für unbekannte und
        fachlich nicht freigegebene Dimensionen antwortet das Backend mit `404`. Die gewählten
        Reifegrade bleiben im Browser. Nur mit Einwilligung sendet das Frontend das vollständige Ergebnis
        an `POST /api/readiness-results` (Ticket #130).
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Dimension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditDimension'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/readiness-results:
    post:
      operationId: saveReadinessResult
      summary: Ergebnis der Selbsteinschätzung anonym speichern oder aktualisieren
      description: |
        Ticket #130. Das Frontend sendet das Ergebnis nur, wenn Nutzer der anonymen Speicherung vorher
        zugestimmt haben. Gespeichert werden nur Reifegrad je Dimension, Sprache und Zeitpunkt.
        `key` ist eine zufällige Kennung, die nur im Arbeitsspeicher des Browserfensters liegt. Mit derselben
        Kennung aktualisiert das Backend das bestehende Ergebnis, statt ein weiteres anzulegen; ein
        unverändertes Ergebnis ändert nichts. Die Kennung steht bewusst im Anfragetext und nicht in der URL,
        damit sie nicht im Zugriffsprotokoll erscheint. Anfragen von fremder Herkunft lehnt das Backend
        mit `403` ab, zu große Anfragetexte mit `413`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadinessResultInput'
      responses:
        '204':
          description: Gespeichert, aktualisiert oder unverändert
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/readiness-results/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: Kennung aus `ReadinessResultInput`
        schema:
          type: string
    delete:
      operationId: deleteReadinessResult
      summary: Gespeichertes Ergebnis löschen, wenn Nutzer ihre Einwilligung zurücknehmen
      description: |
        Antwortet auch dann mit `204`, wenn es zu der Kennung kein Ergebnis gibt. Nach dem Schließen des
        Browserfensters ist die Kennung verloren; das Ergebnis lässt sich dann niemandem mehr zuordnen.
      responses:
        '204':
          description: Gelöscht oder nicht vorhanden
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/consultation-requests:
    post:
      operationId: requestConsultation
      summary: Kostenloses Beratungsgespräch nach der Selbsteinschätzung anfragen
      description: |
        Ticket #136, ADR 0011. Das Formular auf der Auswertung sendet nur die E-Mail-Adresse und die Sprache
        der Seite, kein Ergebnis der Selbsteinschätzung. Das Backend speichert die Anfrage für die Redaktion
        (`GET /api/admin/consultation-requests`), die sich zur Terminabstimmung per E-Mail meldet. Eine erneute
        Anfrage mit derselben Adresse aktualisiert den bestehenden Eintrag. Anfragen von fremder Herkunft lehnt
        das Backend mit `403` ab, zu große Anfragetexte mit `413`, mehr als fünf angenommene Anfragen je
        IP-Adresse und Stunde mit `429`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultationRequestInput'
      responses:
        '204':
          description: Anfrage eingegangen
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: Zu viele Anfragen, später erneut versuchen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/contact-messages:
    post:
      operationId: sendContactMessage
      summary: Nachricht über die Kontaktseite senden
      description: |
        Anforderung #4. Die öffentliche Kontaktseite sendet Name, optional Unternehmen, E-Mail-Adresse, Nachricht
        und die Sprache der Seite. Das Backend speichert die Nachricht für die Redaktion
        (`GET /api/admin/contact-messages`). Fehlende Pflichtangaben, ungültige Adressen und zu lange Angaben lehnt
        es mit `422` ab, Anfragen von fremder Herkunft mit `403`, zu große Anfragetexte mit `413` und mehr als
        100 angenommene Nachrichten je IP-Adresse und Stunde mit `429`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageInput'
      responses:
        '204':
          description: Nachricht eingegangen
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: Zu viele Nachrichten, später erneut versuchen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/health:
    get:
      operationId: getHealth
      summary: Zustand der Anwendung und der Datenbank
      responses:
        '200':
          description: Anwendung und Datenbank sind erreichbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Datenbank ist nicht erreichbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/auth/login:
    post:
      operationId: login
      summary: Anmelden, setzt das Sitzungscookie
      description: |
        Unbekannte E-Mail-Adressen, falsche Passwörter und deaktivierte Konten liefern dieselbe Antwort `401`.
        Nach zu vielen Fehlversuchen von derselben IP-Adresse antwortet das Backend mit `429`. Noch laufende
        Versuche derselben IP-Adresse zählen dabei mit. Sind über alle IP-Adressen bereits zu viele
        Passwortprüfungen in Arbeit, antwortet das Backend vor der Prüfung mit `503` (Ticket #138).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Angemeldet
          headers:
            Set-Cookie:
              description: Sitzungscookie `ki_session` (HttpOnly, SameSite=Lax, bei HTTPS Secure)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Zu viele Fehlversuche, später erneut versuchen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Anmeldung ausgelastet. Zu viele gleichzeitige Passwortprüfungen, nach `Retry-After` Sekunden erneut versuchen. Zählt nicht als Fehlversuch.
          headers:
            Retry-After:
              description: Wartezeit in Sekunden bis zum nächsten Versuch
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Abmelden, löscht die Sitzung serverseitig
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Abgemeldet
          headers:
            Set-Cookie:
              description: Leert das Sitzungscookie
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      operationId: getMe
      summary: Angemeldete Person, Rolle und CSRF-Token
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Angemeldet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/profile:
    get:
      operationId: getProfile
      summary: Eigenes Profil mit Anzeigename und Profilbild
      description: "Ticket #64. Für jedes angemeldete Konto. Es gibt nur das eigene Profil, keine Konto-ID."
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateProfile
      summary: Anzeigenamen ändern
      description: |
        Ticket #64. Der Anzeigename wird getrimmt und darf höchstens 80 Zeichen haben; leer entfernt ihn.
        Weitere Felder wie Rollen ignoriert das Backend. Änderungen erscheinen sofort in veröffentlichten Beiträgen.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/profile/password:
    put:
      operationId: changePassword
      summary: Eigenes Passwort ändern
      description: |
        Ticket #64. Verlangt das aktuelle Passwort. Danach gilt nur noch das neue Passwort; andere Sitzungen des
        Kontos enden, die aktuelle bleibt. Falsches aktuelles oder zu kurzes neues Passwort liefert `422`.
        Fehlversuche zählen wie bei der Anmeldung je IP-Adresse (`429`).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Passwort geändert
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: Zu viele Fehlversuche, später erneut versuchen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Passwortprüfung ausgelastet, nach `Retry-After` Sekunden erneut versuchen
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/profile/avatar:
    put:
      operationId: setProfileAvatar
      summary: Profilbild hochladen oder ersetzen
      description: |
        Ticket #64. Wie beim Titelbild (Ticket #25) JPEG, PNG oder WebP bis 5 MB; das Backend kodiert neu und
        vergibt den Dateinamen. Ungültige Dateien lehnt es mit `422` ab, das bisherige Bild bleibt dann erhalten.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profilbild gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/authors:
    get:
      operationId: adminListAuthors
      summary: Wählbare Autoren für Beiträge
      description: "Ticket #64. Aktive Konten mit Rolle Redakteur oder Admin, sortiert nach Anzeigename und E-Mail-Adresse."
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Autoren
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorOptionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/posts:
    get:
      operationId: adminListPosts
      summary: Alle Beiträge inklusive Entwürfe, zuletzt geänderte zuerst
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Beiträge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPostList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: adminCreatePost
      summary: Neuen Entwurf anlegen
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Entwurf angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/posts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: adminGetPost
      summary: Beitrag mit allen Sprachfassungen zum Bearbeiten laden
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Beitrag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: adminUpdatePost
      summary: Texte, Themen und Einstellungen speichern
      description: |
        Ein veröffentlichter Beitrag bleibt veröffentlicht, die öffentliche Seite zeigt sofort die neue Fassung.
        Er muss dafür in jeder Sprache Titel, Kurztext und Beitragstext behalten (sonst `422`).
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: adminDeletePost
      summary: Beitrag löschen
      description: |
        Löscht den Beitrag mit allen Sprachfassungen und Themenzuordnungen endgültig (Ticket #24).
        Danach ist er öffentlich nicht mehr erreichbar (`404`) und fehlt in der Sitemap.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Gelöscht
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/posts/{id}/cover:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: adminSetPostCover
      summary: Titelbild hochladen oder ersetzen
      description: |
        Ticket #25. Erlaubt sind JPEG, PNG und WebP bis 5 MB und 40 Megapixel; der Typ wird am Inhalt
        erkannt. Das Backend kodiert das Bild neu (ohne Metadaten), vergibt den Dateinamen selbst und legt
        die Varianten 480, 960, 1600 und `og` (1200 × 630) an. Beim Ersetzen bleiben die Alternativtexte
        erhalten, das alte Bild wird gelöscht. Ungültige Dateien lehnt es mit `422` und Begründung ab.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Titelbild gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: adminDeletePostCover
      summary: Titelbild entfernen
      description: Entfernt das Titelbild samt Alternativtexten und Bilddateien. Die Beitragsseite zeigt wieder die Themengrafik.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Titelbild entfernt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/posts/{id}/author:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: adminSetPostAuthor
      summary: Autor zuordnen oder entfernen
      description: |
        Ticket #64. `authorId` ist ein aktives Konto mit Rolle Redakteur oder Admin (sonst `422`); `null` entfernt
        die Zuordnung. Ein neuer Beitrag erhält beim Anlegen das anlegende Konto als Autor.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/posts/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: adminPublishPost
      summary: Veröffentlichen
      description: Verlangt Titel, Kurztext und Beitragstext in jeder vorhandenen Sprache (sonst `422`).
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Veröffentlicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/posts/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: adminSchedulePost
      summary: Automatische Veröffentlichung planen oder ändern
      description: |
        Nur für Beiträge „In Arbeit“ (Ticket #23). Der Zeitpunkt muss in der Zukunft liegen, und der Beitrag
        braucht Titel, Kurztext und Beitragstext in jeder vorhandenen Sprache (sonst `422`). Das Backend
        veröffentlicht fällige Beiträge mit höchstens einer Minute Verzögerung.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        200:
          description: Geplant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: adminUnschedulePost
      summary: Geplanten Zeitpunkt entfernen
      description: Der Beitrag bleibt „In Arbeit“.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        200:
          description: Zeitpunkt entfernt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
  /api/admin/posts/{id}/unpublish:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: adminUnpublishPost
      summary: Veröffentlichung zurücknehmen
      description: Der Beitrag wird wieder zum Entwurf und ist öffentlich nicht mehr erreichbar.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Zurückgenommen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/users:
    get:
      operationId: adminListUsers
      summary: Redaktionskonten mit E-Mail-Adresse, Rolle und Status
      description: Nur für Admin-Konten. Passwörter und Hashes gibt die API nie zurück.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Konten, sortiert nach E-Mail-Adresse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: adminCreateUser
      summary: Konto mit Rollen und Startpasswort anlegen
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Konto angelegt, es kann sich sofort anmelden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: adminUpdateUser
      summary: Konto deaktivieren, reaktivieren oder Rollen ändern
      description: |
        Beim Deaktivieren löscht das Backend alle Sitzungen des Kontos in derselben Transaktion.
        Bereits geöffnete Sitzungen sind damit sofort ungültig. Das eigene Konto lässt sich nicht deaktivieren (`422`).
        `roles` ersetzt die Rollen (Ticket #64): mindestens eine Rolle; einem Admin-Konto lässt sich die Rolle `admin`
        nicht entziehen (`422`). Rollenänderungen gelten sofort für bestehende Sitzungen.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/admin/statistics/page-views:
    get:
      operationId: adminGetPageViews
      summary: Seitenaufrufe je Tag im gewählten Zeitraum
      description: |
        Ticket #130. Der Server zählt jede ausgelieferte öffentliche Seite (Direktaufruf, Link, Neuladen)
        als Tageszähler. Seitenwechsel innerhalb der Anwendung lösen keinen Abruf aus und zählen nicht.
        Besucher werden nicht unterschieden. Für begrenzte Zeiträume enthält `days` jeden Tag, auch ohne
        Aufrufe; für `all` nur Tage mit Aufrufen. Neueste Tage zuerst.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Period'
      responses:
        '200':
          description: Summe und Aufrufe je Tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageViewStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/statistics/readiness-results:
    get:
      operationId: adminListReadinessResults
      summary: Gespeicherte Ergebnisse der Selbsteinschätzung, neueste zuerst
      description: Ticket #130. Je Seite höchstens `pageSize` Ergebnisse.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Period'
        - name: page
          in: query
          required: false
          description: Seite ab 1
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Anzahl im Zeitraum und eine Seite der Ergebnisse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResultPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/contact-messages:
    get:
      operationId: adminListContactMessages
      summary: Nachrichten der Kontaktseite, neueste zuerst
      description: "Anforderung #4. Seit Ticket #64 für die Rollen `marketing` und `admin`."
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Alle Nachrichten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/contact-messages/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: adminDeleteContactMessage
      summary: Nachricht der Kontaktseite löschen
      description: |
        Ticket #90. Löscht eine Nachricht sofort, etwa auf Wunsch der absendenden Person. Erlaubt für die Rollen
        `marketing` und `admin`, die die Nachrichten lesen. Unabhängig davon löscht die Anwendung jede Nachricht
        automatisch spätestens sechs Monate nach Eingang.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Gelöscht
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/consultation-requests:
    get:
      operationId: adminListConsultationRequests
      summary: Offene Anfragen für ein Beratungsgespräch, neueste zuerst
      description: "Ticket #136. Seit Ticket #64 für die Rollen `marketing` und `admin`."
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Alle offenen Anfragen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationRequestList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/consultation-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: adminDeleteConsultationRequest
      summary: Erledigte Anfrage löschen
      description: "Ticket #136. Admins löschen eine Anfrage, sobald der Termin abgestimmt ist (seit Ticket #64 nur Rolle `admin`)."
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Gelöscht
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ki_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Lang:
      name: lang
      in: query
      required: false
      description: Gewünschte Sprache
      schema:
        $ref: '#/components/schemas/Lang'
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Period:
      name: period
      in: query
      required: false
      description: Zeitraum der Statistik, ohne Angabe die letzten 30 Tage
      schema:
        $ref: '#/components/schemas/StatisticsPeriod'
  responses:
    BadRequest:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Nicht angemeldet oder Sitzung abgelaufen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Rolle reicht nicht aus oder CSRF-Token fehlt
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflikt, z. B. bereits vergebenes URL-Kürzel oder E-Mail-Adresse
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Eingaben unvollständig oder ungültig, die Meldung nennt den Grund
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Nicht gefunden oder nicht öffentlich
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ArticleEntry:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          x-go-type-skip-optional-pointer: true
    ArticleBlock:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [paragraph, h1, h2, h3, info, quote, image, ordered, unordered]
        text:
          type: string
          x-go-type-skip-optional-pointer: true
        src:
          type: string
          x-go-type-skip-optional-pointer: true
        alt:
          type: string
          x-go-type-skip-optional-pointer: true
        caption:
          type: string
          x-go-type-skip-optional-pointer: true
        attribution:
          type: string
          x-go-type-skip-optional-pointer: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArticleEntry'
          x-go-type-skip-optional-pointer: true
    ArticleText:
      type: object
      required: [title, blocks]
      properties:
        title:
          type: string
        subtitle:
          type: string
          x-go-type-skip-optional-pointer: true
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ArticleBlock'
    ArticleInput:
      type: object
      required: [status, de]
      properties:
        status:
          $ref: '#/components/schemas/PostStatus'
        authorId:
          type: integer
          format: int64
        de:
          $ref: '#/components/schemas/ArticleText'
        en:
          $ref: '#/components/schemas/ArticleText'
    EditorArticle:
      type: object
      required: [id, authorId, authorLabel, authorActive, de, status]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/PostStatus'
        authorId:
          type: integer
          format: int64
        de:
          $ref: '#/components/schemas/ArticleText'
        en:
          $ref: '#/components/schemas/ArticleText'
        authorLabel:
          type: string
        authorActive:
          type: boolean
    ArticleSummary:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        subtitle:
          type: string
          x-go-type-skip-optional-pointer: true
        status:
          $ref: '#/components/schemas/PostStatus'
    ArticleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'
    PublishedArticle:
      type: object
      required: [lang, content]
      properties:
        lang:
          $ref: '#/components/schemas/Lang'
        content:
          $ref: '#/components/schemas/ArticleText'
        authorName:
          type: string
          x-go-type-skip-optional-pointer: true
    ArticleImage:
      type: object
      required: [src]
      properties:
        src:
          type: string
    Lang:
      type: string
      enum: [de, en]
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
    TopicRef:
      type: object
      description: Kurzform eines Themas, z. B. für Themen-Chips
      required: [slug, lang, title, label]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        label:
          type: string
          description: Kurze Bezeichnung für Chips
    Topic:
      type: object
      required: [slug, lang, title, label, summary, intro, postCount]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        label:
          type: string
        summary:
          type: string
          description: Eine Zeile Beschreibung für Menü und Karten
        intro:
          type: string
          description: Einführung auf der Themenseite
        postCount:
          type: integer
          description: Anzahl der veröffentlichten Beiträge
    TopicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
    TopicDetail:
      allOf:
        - $ref: '#/components/schemas/Topic'
        - type: object
          required: [posts, translations]
          properties:
            translations:
              type: array
              description: Sprachen, in denen das Thema vorliegt
              items:
                $ref: '#/components/schemas/Lang'
            posts:
              type: array
              items:
                $ref: '#/components/schemas/PostSummary'
    Image:
      type: object
      required: [src, srcset, width, height, alt]
      properties:
        src:
          type: string
          description: URL der mittleren Variante (960 px)
        srcset:
          type: string
          description: Varianten 480, 960 und 1600 px für `srcset`
        width:
          type: integer
        height:
          type: integer
        alt:
          type: string
        altLang:
          $ref: '#/components/schemas/Lang'
    PostSummary:
      type: object
      required: [slug, lang, title, summary, publishedAt, featured, topics, translations]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        summary:
          type: string
          description: Kurztext
        publishedAt:
          type: string
          format: date-time
        featured:
          type: boolean
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicRef'
        translations:
          type: array
          description: Sprachen, in denen der Beitrag vorliegt
          items:
            $ref: '#/components/schemas/Lang'
        cover:
          $ref: '#/components/schemas/Image'
    PostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
    Post:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          required: [bodyMarkdown, readingMinutes, updatedAt]
          properties:
            bodyMarkdown:
              type: string
            readingMinutes:
              type: integer
            updatedAt:
              type: string
              format: date-time
            author:
              $ref: '#/components/schemas/PostAuthor'
    PostAuthor:
      type: object
      description: |
        Öffentliche Autorendaten (Ticket #64). Nur vorhanden, wenn der Beitrag einen Autor mit Anzeigenamen hat.
        Enthält bewusst keine E-Mail-Adresse.
      required: [name]
      properties:
        name:
          type: string
        avatar:
          $ref: '#/components/schemas/Avatar'
    Avatar:
      type: object
      description: Profilbild in der Variante 480 px
      required: [src, width, height]
      properties:
        src:
          type: string
        width:
          type: integer
        height:
          type: integer
    Role:
      type: string
      description: |
        Ticket #64: `admin` darf alles einschließlich Benutzerverwaltung, `editor` (Redakteur) verwaltet Beiträge,
        `marketing` liest Statistik, Nachrichten und Beratungsanfragen. Ein Konto hat mindestens eine Rolle.
      enum: [admin, editor, marketing]
    Roles:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/Role'
    Profile:
      type: object
      required: [email, displayName, roles]
      properties:
        email:
          type: string
        displayName:
          type: string
        roles:
          $ref: '#/components/schemas/Roles'
        avatar:
          $ref: '#/components/schemas/Avatar'
    ProfileInput:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 80
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: Mindestens 10 Zeichen
    AuthorOption:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string
    AuthorOptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorOption'
    AuthorInput:
      type: object
      required: [authorId]
      properties:
        authorId:
          type: integer
          format: int64
          nullable: true
          description: Konto-ID des Autors oder `null` für „Kein Autor“
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    Me:
      type: object
      required: [id, email, displayName, roles, csrfToken]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string
        roles:
          $ref: '#/components/schemas/Roles'
        csrfToken:
          type: string
          description: Für den Header `X-CSRF-Token` bei schreibenden Aufrufen
    PostStatus:
      type: string
      description: "`draft` erscheint in der Redaktion als „In Arbeit“, `published` als „Veröffentlicht“"
      enum: [draft, published]
    PostText:
      type: object
      description: Fassung eines Beitrags in einer Sprache
      required: [lang, title, summary, bodyMarkdown]
      properties:
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        summary:
          type: string
          description: Kurztext
        bodyMarkdown:
          type: string
        coverAlt:
          type: string
          description: |
            Alternativtext des Titelbilds in dieser Sprache (Ticket #25). Hat der Beitrag ein Titelbild,
            ist er zum Veröffentlichen in jeder Fassung nötig.
    PostInput:
      type: object
      required: [featured, topics, texts]
      properties:
        slug:
          type: string
          description: URL-Kürzel. Leer lassen, um es aus dem Titel zu erzeugen.
        featured:
          type: boolean
          description: Im Karussell der Startseite hervorheben
        topics:
          type: array
          description: Slugs der zugeordneten Themen
          items:
            type: string
        texts:
          type: array
          description: Fassungen je Sprache. Leere Fassungen werden nicht gespeichert.
          items:
            $ref: '#/components/schemas/PostText'
    EditorPost:
      type: object
      required: [id, slug, status, featured, topics, texts, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        featured:
          type: boolean
        topics:
          type: array
          items:
            type: string
        texts:
          type: array
          items:
            $ref: '#/components/schemas/PostText'
        publishedAt:
          type: string
          format: date-time
          description: Erste Veröffentlichung
        scheduledAt:
          type: string
          format: date-time
          description: Geplante automatische Veröffentlichung in UTC, nur bei Beiträgen „In Arbeit“
        cover:
          $ref: '#/components/schemas/Image'
        authorId:
          type: integer
          format: int64
          description: "Konto-ID des Autors (Ticket #64), fehlt bei „Kein Autor“"
        updatedAt:
          type: string
          format: date-time
    EditorPostSummary:
      type: object
      required: [id, slug, status, title, featured, topics, translations, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        status:
          $ref: '#/components/schemas/PostStatus'
        title:
          type: string
          description: Deutscher Titel, sonst der Titel einer anderen Sprache
        featured:
          type: boolean
        topics:
          type: array
          items:
            type: string
        translations:
          type: array
          items:
            $ref: '#/components/schemas/Lang'
        publishedAt:
          type: string
          format: date-time
        scheduledAt:
          type: string
          format: date-time
          description: Geplante automatische Veröffentlichung in UTC
        updatedAt:
          type: string
          format: date-time
    ScheduleInput:
      type: object
      required: [publishAt]
      properties:
        publishAt:
          type: string
          format: date-time
          description: Zeitpunkt der automatischen Veröffentlichung, mit Zeitzone (wird in UTC gespeichert)
    User:
      type: object
      description: Redaktionskonto ohne Passwortdaten
      required: [id, email, displayName, roles, active, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string
          description: Vom Konto selbst gepflegter Anzeigename, leer wenn nicht gesetzt
        roles:
          $ref: '#/components/schemas/Roles'
        active:
          type: boolean
          description: Deaktivierte Konten können sich nicht anmelden
        createdAt:
          type: string
          format: date-time
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
    NewUser:
      type: object
      required: [email, password, roles]
      properties:
        email:
          type: string
          description: Eindeutige E-Mail-Adresse, Groß- und Kleinschreibung zählt nicht. Dient als Benutzername.
        password:
          type: string
          description: Startpasswort mit mindestens 10 Zeichen
        roles:
          $ref: '#/components/schemas/Roles'
    UserPatch:
      type: object
      description: Mindestens eines der Felder angeben.
      properties:
        active:
          type: boolean
        roles:
          $ref: '#/components/schemas/Roles'
    EditorPostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EditorPostSummary'
    AuditCategory:
      type: string
      description: Einordnung der Dimension (organisatorisch, fachlich, technisch)
      enum: [organizational, business, technical]
    AuditLevelInfo:
      type: object
      description: Allgemeine Beschreibung eines Reifegrads
      required: [level, name, motto]
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 3
        name:
          type: string
          description: Einfach, Strukturiert oder Intelligent
        motto:
          type: string
          description: Leitsatz des Reifegrads
    AuditDimensionSummary:
      type: object
      required: [slug, lang, title, summary, category, intro]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        summary:
          type: string
          description: Eine Zeile Beschreibung für die Übersicht
        category:
          $ref: '#/components/schemas/AuditCategory'
        intro:
          type: array
          description: Absätze der Erklärung; die Übersicht zeigt sie aufklappbar (Ticket #112)
          items:
            type: string
    AuditOverview:
      type: object
      required: [lang, translations, intro, guidance, classification, levels, dimensions]
      properties:
        lang:
          $ref: '#/components/schemas/Lang'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/Lang'
        intro:
          type: array
          description: Absätze der Einführung (Markdown)
          items:
            type: string
        guidance:
          type: string
          description: Anleitung und fachliche Einordnung als Markdown in der angegebenen Inhaltssprache
        classification:
          type: string
          description: |
            Fachliche Einordnung der Ergebnisse als Markdown (Ende von `guidance`). Die Gesamtauswertung zeigt
            sie neben dem Netzdiagramm (Ticket #114).
        levels:
          type: array
          description: Die Reifegrade 1 bis 3
          items:
            $ref: '#/components/schemas/AuditLevelInfo'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/AuditDimensionSummary'
    AuditQuestion:
      type: object
      description: Prüffrage als Entscheidungshilfe; sie wird nicht einzeln beantwortet (Ticket #113).
      required: [id, text]
      properties:
        id:
          type: string
          description: Reifegrad und laufende Nummer, z. B. `2.3`
        text:
          type: string
    AuditLevel:
      type: object
      required: [level, name, description, questions]
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 3
        name:
          type: string
        description:
          type: string
          description: Bedeutung des Reifegrads in dieser Dimension
        questions:
          type: array
          description: Prüffragen dieses Reifegrads als Entscheidungshilfe
          items:
            $ref: '#/components/schemas/AuditQuestion'
    AuditDimension:
      type: object
      required: [slug, lang, title, summary, category, translations, intro, benefits, levels]
      properties:
        slug:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        title:
          type: string
        summary:
          type: string
        category:
          $ref: '#/components/schemas/AuditCategory'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/Lang'
        intro:
          type: array
          description: Absätze der Einführung
          items:
            type: string
        benefits:
          type: array
          description: Mindestens zwei konkrete Vorteile
          items:
            type: string
        levels:
          type: array
          description: |
            Reifegrade 1 bis 3, aus denen Nutzer genau einen wählen. Es gibt keine automatische Ableitung
            aus den Prüffragen und keinen Reifegrad 0 (Ticket #113).
          items:
            $ref: '#/components/schemas/AuditLevel'
    StatisticsPeriod:
      type: string
      description: Letzte 7 Tage, letzte 30 Tage (jeweils einschließlich heute, Kalendertage in Europe/Berlin) oder gesamt
      enum: [7d, 30d, all]
      default: 30d
    ReadinessRating:
      type: object
      required: [dimension, level]
      properties:
        dimension:
          type: string
          description: Slug einer freigegebenen Dimension
        level:
          type: integer
          minimum: 1
          maximum: 3
    ReadinessResultInput:
      type: object
      description: |
        Vollständiges Ergebnis: jede freigegebene Dimension genau einmal mit Reifegrad 1 bis 3.
        Unvollständige oder ungültige Ergebnisse lehnt das Backend mit `422` ab.
      required: [key, lang, ratings]
      properties:
        key:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Zufällige Kennung (128 Bit, hexadezimal) aus dem Arbeitsspeicher des Browserfensters
        lang:
          $ref: '#/components/schemas/Lang'
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessRating'
    PageViewDay:
      type: object
      required: [date, views, uniqueViews]
      properties:
        date:
          type: string
          description: Kalendertag in Europe/Berlin (JJJJ-MM-TT)
        views:
          type: integer
          format: int64
        uniqueViews:
          type: integer
          format: int64
          nullable: true
          description: Unterschiedliche IPs je Kalendertag; null bei fehlenden oder unvollständigen Daten
    PageViewStats:
      type: object
      required: [period, total, uniqueTotal, uniqueSince, days]
      properties:
        period:
          $ref: '#/components/schemas/StatisticsPeriod'
        total:
          type: integer
          format: int64
          description: Absolute Seitenaufrufe im Zeitraum
        uniqueTotal:
          type: integer
          format: int64
          nullable: true
          description: Unterschiedliche IPs im gesamten Zeitraum (keine Summe der Tageswerte); null bei Datenlücken
        uniqueSince:
          type: string
          nullable: true
          description: Beginn des aktuellen IP-Zuordnungsbestands als UTC-Zeitpunkt (RFC 3339)
        days:
          type: array
          items:
            $ref: '#/components/schemas/PageViewDay'
    ReadinessDimensionName:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
        title:
          type: string
    ReadinessResult:
      type: object
      required: [id, lang, submittedAt, ratings]
      properties:
        id:
          type: integer
          format: int64
          description: Laufende Nummer in der Datenbank, nicht die Kennung aus dem Browser
        lang:
          $ref: '#/components/schemas/Lang'
        submittedAt:
          type: string
          format: date-time
          description: Zeitpunkt der letzten Speicherung
        ratings:
          type: array
          description: Reifegrade in Ablaufreihenfolge der Dimensionen
          items:
            $ref: '#/components/schemas/ReadinessRating'
    ReadinessResultPage:
      type: object
      required: [period, total, page, pageSize, dimensions, levels, items]
      properties:
        period:
          $ref: '#/components/schemas/StatisticsPeriod'
        total:
          type: integer
          format: int64
          description: Gespeicherte Ergebnisse im Zeitraum
        page:
          type: integer
        pageSize:
          type: integer
        dimensions:
          type: array
          description: Freigegebene Dimensionen mit deutschem Titel, in Ablaufreihenfolge
          items:
            $ref: '#/components/schemas/ReadinessDimensionName'
        levels:
          type: array
          description: Namen der Reifegrade, z. B. Strukturiert
          items:
            $ref: '#/components/schemas/AuditLevelInfo'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessResult'
    ContactMessageInput:
      type: object
      description: |
        Nachricht von der Kontaktseite (Anforderung #4). Name, E-Mail-Adresse und Nachricht sind Pflicht, das
        Unternehmen ist optional. Leere oder zu lange Angaben und ungültige Adressen lehnt das Backend mit `422` ab.
      required: [name, email, message, lang]
      properties:
        name:
          type: string
          maxLength: 200
        company:
          type: string
          maxLength: 200
          description: Optional; leer oder fehlend, wenn nicht angegeben
        email:
          type: string
          maxLength: 254
        message:
          type: string
          maxLength: 5000
        lang:
          $ref: '#/components/schemas/Lang'
    ContactMessage:
      type: object
      required: [id, name, company, email, message, lang, receivedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        company:
          type: string
          description: Leer, wenn nicht angegeben
        email:
          type: string
          description: Normalisiert (ohne Leerzeichen, kleingeschrieben)
        message:
          type: string
        lang:
          $ref: '#/components/schemas/Lang'
        receivedAt:
          type: string
          format: date-time
    ContactMessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactMessage'
    ConsultationRequestInput:
      type: object
      description: |
        Anfrage für ein kostenloses Beratungsgespräch (Ticket #136). Die E-Mail-Adresse ist die einzige
        Angabe der Person. Leere oder ungültige Adressen lehnt das Backend mit `422` ab.
      required: [email, lang]
      properties:
        email:
          type: string
          maxLength: 254
          description: E-Mail-Adresse für die Terminabstimmung; Groß- und Kleinschreibung zählt nicht
        lang:
          $ref: '#/components/schemas/Lang'
    ConsultationRequest:
      type: object
      required: [id, email, lang, requestedAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          description: Normalisiert (ohne Leerzeichen, kleingeschrieben)
        lang:
          $ref: '#/components/schemas/Lang'
        requestedAt:
          type: string
          format: date-time
          description: Zeitpunkt der letzten Anfrage mit dieser Adresse
    ConsultationRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsultationRequest'
